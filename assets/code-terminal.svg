<svg width="720" height="520" viewBox="0 0 720 520"
     xmlns="http://www.w3.org/2000/svg">

<style>
  .bg {
    fill: #16181d;
    stroke: #34373d;
    stroke-width: 2;
  }

  .code {
    font-family: "Courier New", monospace;
    font-size: 16px;
    fill: #b9d7ff;
  }

  .orange { fill: #ff7b72; }
  .purple { fill: #d2a8ff; }
  .green  { fill: #7ee787; }
  .yellow { fill: #e3b341; }
  .blue   { fill: #79c0ff; }

  .line {
    opacity: 0;
    animation: appear .25s forwards;
  }

  .l1  { animation-delay: .3s; }
  .l2  { animation-delay: .7s; }
  .l3  { animation-delay: 1.1s; }
  .l4  { animation-delay: 1.5s; }
  .l5  { animation-delay: 1.9s; }
  .l6  { animation-delay: 2.3s; }
  .l7  { animation-delay: 2.7s; }
  .l8  { animation-delay: 3.1s; }
  .l9  { animation-delay: 3.5s; }
  .l10 { animation-delay: 3.9s; }
  .l11 { animation-delay: 4.3s; }
  .l12 { animation-delay: 4.7s; }

  @keyframes appear {
    to { opacity: 1; }
  }

  .cursor {
    animation: blink .8s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>

<!-- terminal -->
<rect class="bg"
      x="1" y="1"
      rx="14"
      width="718"
      height="518"/>

<!-- traffic lights -->
<circle cx="28" cy="26" r="7" fill="#ff5f57"/>
<circle cx="50" cy="26" r="7" fill="#febc2e"/>
<circle cx="72" cy="26" r="7" fill="#28c840"/>

<!-- code -->

<text x="25" y="65" class="code line l1">
  <tspan class="orange">const</tspan>
  <tspan fill="#ffffff"> aleana = {</tspan>
</text>

<text x="50" y="95" class="code line l2">
  <tspan class="blue">name:</tspan>
  <tspan class="green"> "Maria Aleana De Leon",</tspan>
</text>

<text x="50" y="125" class="code line l3">
  <tspan class="blue">bio:</tspan>
  <tspan class="green"> "AI • Automation • Product Builder",</tspan>
</text>

<text x="50" y="155" class="code line l4">
  <tspan class="blue">location:</tspan>
  <tspan class="green"> "Philippines 🇵🇭",</tspan>
</text>

<text x="50" y="185" class="code line l5">
  <tspan class="blue">studying:</tspan>
  <tspan class="green"> "Mechanical Engineering",</tspan>
</text>

<text x="50" y="230" class="code line l6">
  <tspan class="blue">building:</tspan>
  <tspan class="purple"> [</tspan>
  <tspan class="green">"Resumie.io"</tspan>
  <tspan class="purple">,</tspan>
  <tspan class="green"> "AI Tools"</tspan>
  <tspan class="purple">],</tspan>
</text>

<text x="50" y="260" class="code line l7">
  <tspan class="blue">automation:</tspan>
  <tspan class="purple"> [</tspan>
  <tspan class="green">"n8n", "Zapier", "Claude Code"</tspan>
  <tspan class="purple">],</tspan>
</text>

<text x="50" y="290" class="code line l8">
  <tspan class="blue">frontend:</tspan>
  <tspan class="purple"> [</tspan>
  <tspan class="green">"JavaScript", "React", "Tailwind"</tspan>
  <tspan class="purple">],</tspan>
</text>

<text x="50" y="320" class="code line l9">
  <tspan class="blue">backend:</tspan>
  <tspan class="purple"> [</tspan>
  <tspan class="green">"Supabase", "Vercel"</tspan>
  <tspan class="purple">],</tspan>
</text>

<text x="50" y="365" class="code line l10">
  <tspan class="blue">currentFocus:</tspan>
  <tspan class="green"> "Building useful things with AI",</tspan>
</text>

<text x="50" y="395" class="code line l11">
  <tspan class="blue">philosophy:</tspan>
  <tspan class="green"> "Build. Ship. Learn."</tspan>
</text>

<text x="25" y="435" class="code line l12">
  <tspan fill="#ffffff">};</tspan>
</text>

<!-- blinking cursor -->
<rect
  class="cursor"
  x="49"
  y="455"
  width="10"
  height="20"
  fill="#7ee787"/>
</svg>
